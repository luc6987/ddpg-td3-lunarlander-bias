[project]
name = "lunar-bias"
version = "0.2.0"
description = "DDPG vs TD3 on continuous LunarLander: layer normalisation, overestimation bias and performance"
requires-python = ">=3.12,<3.13"

# Ranges here; exact versions live in uv.lock (committed). requirements.txt is
# generated from the lock by `uv export` — never edit it by hand.
# No rl-mind: the study owns its single-environment loop, fixed-seed evaluation,
# LayerNorm option and raw probe data.
dependencies = [
    "torch>=2.4,<3",
    # LunarLander lives in gymnasium's box2d extra. On gymnasium>=1.2 that is
    # box2d==2.3.10 (cp312 wheels for macOS arm64 and manylinux). NOT box2d-py.
    "gymnasium[box2d]>=1.2,<2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# The laptop (macOS arm64) and the SSH server (Linux) only.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

# CPU-only torch on Linux: PyPI's default Linux wheel pulls ~2 GB of CUDA packages.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_bias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the box2d environment or long training"]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
